<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  The SoundBox wordmark, from Marcus Geelnard's SoundBox (gui/original/
  soundbox.svg in the vendored upstream tree, GPLv3; see gpl.txt),
  recoloured white for this editor's dark startup panel (index.html's
  #audio-gate). Everything here is upstream geometry. What changed:

  1. Only the two drawn layers are kept, the isometric box between SOUND
     and BOX and the wordmark's outline path, and every Inkscape editor
     artefact (138 KB of unused gradients, path effects, perspective and
     RDF metadata) is dropped.
  2. The outline path's gold gradient fill is now plain white.
  3. Upstream filled the letter bodies with a text element set in Waree
     Bold Oblique, a font nobody outside that machine has; without it the
     fallback ran about 20% wide and spilled past the outline (checked in
     Chromium). It is still a text element, since the glyphs were never
     available as paths, but it now asks for a common bold oblique sans
     and is pinned to the outline's own width with textLength plus
     lengthAdjust, so a substituted font lands inside the letterforms
     rather than beside them. The thin white stroke fattens the body just
     enough to close the seam a substituted glyph leaves against the
     outline. The outline path is painted last, so it, not the text,
     defines every visible edge.

  (No double hyphens anywhere above: XML comments cannot contain them, and
  a malformed comment makes the whole file fail to parse as an image.)
-->

